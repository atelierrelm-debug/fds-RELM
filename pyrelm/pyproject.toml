[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrelm"
version = "0.1.0"
description = "A Pythonic interface for FDS (Fire Dynamics Simulator): build models, run the solver, analyze results"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["pyrelm*"]
